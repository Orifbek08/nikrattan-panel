function panelSahifa(){
  var h=sarlavha('Бошқарув панели','Кечаги ҳисобот — '+kechaMatn(),'');

  /* ── 1. Режа ва факт (сотув) ── */
  h+='<div class="sec" style="margin-top:4px"><h2>Режа ва факт</h2><p>«план» варағидан'+
     (D.reja&&D.reja.sana?' — режа '+dfmt(D.reja.sana)+' дан':'')+'</p></div>';
  if(!D.sotuv) h+='<div class="pv-card">'+(holat('sotuv')||'')+'</div>';
  else{
    var rq=(D.reja&&D.reja.qatorlar)||[], jr={reja:0,fakt:0};
    rq.forEach(function(x){ jr.reja+=x.reja; jr.fakt+=x.fakt });
    var RR=['#E0A048','#4ECB92','#6FA8DC','#A08FD0','#D77B96','#C08B5E'];
    function karta(nom,r,rng,katta){
      var f=r.reja?r.fakt/r.reja*100:0;
      return '<div class="pv-rj'+(katta?' jami':'')+'" style="--pc:'+rng+'">'+
        '<div class="pv-rjn">'+esc(nom)+'</div>'+
        '<div class="pv-rjb">'+halqa(f,rng,katta?112:84,katta?11:12,'<b class="num" style="font-size:'+(katta?30:22)+'px">'+Math.round(f)+'%</b>')+
        '<div class="pv-rjs"><div><span>Факт</span><b class="num">'+fmt(r.fakt)+'</b></div>'+
          '<div><span>Режа</span><b class="num">'+fmt(r.reja)+'</b></div>'+
          '<div><span>Қолди</span><b class="num q">'+fmt(Math.max(0,r.reja-r.fakt))+'</b></div></div></div></div>';
    }
    h+= rq.length
      ? '<div class="pv-rjg nr-rjg" style="--rjn:'+Math.min(rq.length,4)+'">'+
          karta('Жами',jr,jr.fakt>=jr.reja&&jr.reja?'var(--ok)':'var(--a)',true)+
          rq.map(function(x,i){ return karta(x.nom,x,RR[i%RR.length],false) }).join('')+'</div>'
      : '<div class="empty"><b>Режа киритилмаган</b>«план» варағини тўлдиринг</div>';
  }

  /* ── 2. Кечанинг энг зўрлари ── */
  h+='<div class="sec"><h2>Кечанинг энг зўрлари</h2><p>Энг кўп сотган менежер ва энг кўп ишлаб чиқарган уста</p></div>';
  function golib(sar,l,kalit,birlik,qoshimcha){
    if(!l) return '<div class="pv-card">'+pvKutish()+'</div>';
    var k=l.filter(function(x){ return kechaMi(x.sana) && x[kalit] });
    var g=grup(k,function(x){ return x[kalit] },function(x){ return x.soni||1 },qoshimcha);
    if(!g.length) return '<div class="pv-card"><div class="pv-wait">Кеча '+esc(sar.toLowerCase())+' бўйича ёзув йўқ</div></div>';
    var b=g[0];
    return '<div class="pv-gold">'+
      '<div class="pv-gmed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+
        '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></div>'+
      '<div class="pv-gtx"><div class="pv-kick">'+esc(sar)+'</div><div class="pv-gnm">'+esc(b.nom)+'</div>'+
        '<div class="pv-gchs">'+(g[1]?'<span class="pv-gch">2-ўрин: '+esc(g[1].nom)+' <b>'+fmt(g[1].qiy)+'</b></span>':'')+'</div></div>'+
      '<div class="pv-gval"><div><b class="num">'+fmt(b.qiy)+'</b><span>'+birlik+'</span></div>'+
        (b.a?'<div><b class="num k">'+spul(b.a)+'</b><span>тушум</span></div>':'')+'</div></div>';
  }
  h+='<div class="nr-ikki">'+
    golib('Кечанинг энг зўр менежери',D.sotuv,'menejer','дона сотди',function(g,x){ g.a+=x.tolangan })+
    golib('Кечанинг энг фаол устаси',D.ish,'usta','бирлик ишлади')+
  '</div>';

  /* ── 3. Кечаги ҳисобот ── */
  function kt(nom,rng,ich){ return '<div class="pv-kt" style="--pc:'+rng+'"><div class="pv-ktn">'+nom+'</div>'+ich+'</div>' }
  function ktp(l,v,c){ return '<div class="pv-ktp"><span>'+l+'</span><b class="num'+(c?' '+c:'')+'">'+v+'</b></div>' }
  function kut(k){ return '<div class="pv-ktw">'+(XATO[k]?'хатолик':'юкланмоқда…')+'</div>' }

  var ks=D.sotuv?D.sotuv.filter(function(x){ return kechaMi(x.sana) }):null, sj={soni:0,tol:0,qarz:0};
  if(ks) ks.forEach(function(x){ sj.soni+=x.soni; sj.tol+=x.tolangan; sj.qarz+=x.qarz });
  var ki=D.ish?D.ish.filter(function(x){ return kechaMi(x.sana) }):null, ij={sht:0,kv:0};
  if(ki) ki.forEach(function(x){ if(x.birlik==='кв') ij.kv+=x.soni; else ij.sht+=x.soni });
  var kl=D.mk?D.mk.filter(function(x){ return kechaMi(x.sana) }):null, lj={jami:0,sotuv:0};
  if(kl) kl.forEach(function(x){ lj.jami++; lj.sotuv+=x.sotuv });
  var km=D.moliya?D.moliya.filter(function(x){ return kechaMi(x.sana) && !qarzKassa(x.kassa) }):null, mj={k:0,c:0};
  if(km) km.forEach(function(x){ if(x.tip==='kirim') mj.k+=x.summa; else mj.c+=x.summa });

  h+='<div class="sec"><h2>Кечаги ҳисобот</h2><p>'+esc(kechaMatn())+' — ҳамма бўлим бўйича</p></div>'+
    '<div class="pv-kgrid nr-kg4">'+
    kt('Сотув','#E0A048', ks ? '<div class="pv-ktv num">'+fmt(sj.soni)+'<small>дона</small></div>'+
        ktp('Тушум',spul(sj.tol),'k')+ktp('Қарзга',spul(sj.qarz),'q') : kut('sotuv'))+
    kt('Ишлаб чиқариш','#4ECB92', ki ? '<div class="pv-ktv num">'+fmt(ij.sht+ij.kv)+'<small>бирлик</small></div>'+
        ktp('Дона (шт)',fmt(ij.sht))+ktp('Квадрат (кв)',fmt(ij.kv)) : kut('ish'))+
    kt('Маркетинг','#6FA8DC', kl ? '<div class="pv-ktv num">'+fmt(lj.jami)+'<small>лид</small></div>'+
        ktp('Сотув',fmt(lj.sotuv),'k')+ktp('Конверсия',lj.jami?(lj.sotuv/lj.jami*100).toFixed(1)+'%':'—') : kut('mk'))+
    kt('Молия','#A08FD0', km ? '<div class="pv-ktv num" style="font-size:24px">'+mpul(mj.k-mj.c)+'</div>'+
        ktp('Кирим',mpul(mj.k),'k')+ktp('Чиқим',mpul(mj.c),'q') : kut('moliya'))+
    '</div>';

  /* ── 4. Кассалар ── */
  h+='<div class="sec"><h2>Кассаларда ҳозир</h2><p>Бутун тарих бўйича: кирим − чиқим</p></div>';
  h+= D.moliya ? kassaBlok(D.moliya) : '<div class="pv-card">'+(holat('moliya')||'')+'</div>';
  return h;
}

function pvKutish(){ return '<div class="pv-wait"><div class="spin"></div>Юкланмоқда…</div>' }

/* ══════════════════════════════════════════════════════
   1. СОТУВ
   ══════════════════════════════════════════════════════ */

function sSatr(){ return D.sotuv ? sanaFiltrla(D.sotuv).map(function(x){ x.kishi=x.soni; return x }) : [] }
function sJam(l){ var o={soni:0,dona:0,kel:0,tol:0,qarz:0}; l.forEach(function(x){ o.soni++; o.dona+=x.soni; o.kel+=x.kelishuv; o.tol+=x.tolangan; o.qarz+=x.qarz }); return o }
function sGrup(l,ol){ return grup(l,ol,function(x){ return x.soni },function(g,x){ g.a+=x.tolangan; g.b+=x.qarz; g.c+=x.kelishuv }) }

function sotuvSahifa(){
  var x=holat('sotuv');
  var nomlar={umumiy:'Сотув — умумий',menejer:'Сотув — менежерлар',kesim:'Сотув — маҳсулот ва ҳудуд',jurnal:'Сотувлар'};
  if(x) return sarlavha(nomlar[S.sahifa],'',sanaFiltr())+x;
  S.birlik='дона';
  var l=sSatr(), j=sJam(l);

  if(S.sahifa==='umumiy'){
    var rq=(D.reja&&D.reja.qatorlar)||[], rj={reja:0,fakt:0};
    rq.forEach(function(r){ rj.reja+=r.reja; rj.fakt+=r.fakt });
    var tur=sGrup(l,function(x){ return x.tur });
    return sarlavha(nomlar.umumiy,'Режа, сотилган дона, тушум ва қарз',sanaFiltr())+
      '<div class="mets">'+
        '<div class="met o"><div class="met-l">Режа</div><div class="met-v num">'+fmt(rj.reja)+'</div>'+
          '<div class="met-d">факт '+fmt(rj.fakt)+' · қолди '+fmt(Math.max(0,rj.reja-rj.fakt))+'</div>'+
          '<div class="mprog"><i style="width:'+Math.min(100,foiz(rj.fakt,rj.reja))+'%;background:var(--ochre)"></i></div></div>'+
        metK('','Сотилди',fmt(j.dona)+' <small style="font-size:14px;color:var(--muted)">дона</small>',fmt(j.soni)+' та битим')+
        metK('k','Тушум',spul(j.tol),'договор '+spul(j.kel))+
        metK('c','Қарз',spul(j.qarz),'договорнинг '+foiz(j.qarz,j.kel)+'%')+
      '</div>'+
      bolim('Режа бажарилиши','Маҳсулот тури бўйича. Қора чизиқ — режа даражаси.',
        rejaUstun(rq.map(function(r){ return {rop:r.nom,reja:r.reja,fakt:r.fakt} })))+
      '<div class="two">'+
        '<div>'+bolim('Сотув тури','Онлайн ва фура — дона бўйича',
          mDoira(tur.map(function(g){ return {nom:g.nom,summa:g.qiy,soni:g.soni} }),null,function(v){ return fmt(v)+' дона' }))+'</div>'+
        '<div>'+bolim('Маҳсулот','Қайси тоифа кўп сотилди',
          ustunlar(sGrup(l,function(x){ return x.produkt }).map(function(g){ return {nom:g.nom,qiy:g.qiy,ong:spul(g.a)} })))+'</div>'+
      '</div>'+
      bolim('Сотув динамикаси','Ҳар бир санада неча дона сотилди',davrQatori(l)+dinamika(l));
  }

  if(S.sahifa==='menejer'){
    var m=sGrup(l,function(x){ return x.menejer }), mx=m.length?m[0].qiy:1;
    return sarlavha(nomlar.menejer,'Ким қанча сотди — дона, тушум ва қарз',sanaFiltr())+
      '<div class="grid">'+(m.length?m.map(function(g,i){
        return '<div class="card"><span class="rank">#'+(i+1)+'</span><div class="cn">'+esc(g.nom)+'</div>'+
          '<div class="cm">'+spul(g.a)+(g.b?' · қарз '+spul(g.b):'')+'</div>'+
          '<div class="cq"><b class="num">'+fmt(g.qiy)+'</b><span>дона · '+g.soni+' битим</span></div>'+
          '<div class="cbar"><i style="width:'+Math.max(3,g.qiy/mx*100)+'%;background:'+rang(i)+'"></i></div></div>';
      }).join(''):'<div class="empty">Маълумот йўқ</div>')+'</div>'+
      bolim('Тушум бўйича','Менежерлар тушган пул бўйича',
        ustunlar(m.slice().sort(function(a,b){ return b.a-a.a }).map(function(g){ return {nom:g.nom,qiy:g.a,ong:'қарз '+spul(g.b)} })));
  }

  if(S.sahifa==='kesim'){
    return sarlavha(nomlar.kesim,'Қайси модел ва қайси ҳудудга',sanaFiltr())+
      '<div class="two">'+
        '<div>'+bolim('Моделлар','Тип продукт бўйича',
          ustunlar(sGrup(l,function(x){ return x.tovar }).slice(0,20).map(function(g){ return {nom:g.nom,ost:g.satrlar[0].produkt,qiy:g.qiy,ong:spul(g.a)} })))+'</div>'+
        '<div>'+bolim('Ҳудудлар','Қаерга сотилди',
          ustunlar(sGrup(l,function(x){ return x.hudud }).map(function(g){ return {nom:g.nom,qiy:g.qiy,ong:spul(g.a)} })))+'</div>'+
      '</div>';
  }

  // jurnal
  var q=qFiltr(l,function(x){ return [x.mijoz,x.menejer,x.hudud,x.tovar,x.produkt,x.tur].join(' ') })
    .sort(function(a,b){ return (sanaOqi(b.sana)||0)-(sanaOqi(a.sana)||0) });
  var k=q.slice(0,300);
  return sarlavha(nomlar.jurnal,'«Продажа» варағидаги ёзувлар',qidir('Мижоз, менежер, ҳудуд…')+sanaFiltr())+
    jadval([{n:'Сана'},{n:'Мижоз'},{n:'Тур'},{n:'Маҳсулот'},{n:'Ҳудуд'},{n:'Менежер'},
            {n:'Сони',r:1},{n:'Договор',r:1},{n:'Тўланган',r:1},{n:'Қарз',r:1}],
      k.map(function(x){ return [dfmt(x.sana),x.mijoz,x.tur,{h:esc(x.tovar)+'<br><small style="color:var(--muted)">'+esc(x.produkt)+'</small>'},
        x.hudud,x.menejer,{h:fmt(x.soni)},{h:spul(x.kelishuv)},{h:spul(x.tolangan),s:'color:var(--green);font-weight:600'},
        {h:spul(x.qarz),s:'color:'+(x.qarz>0?'var(--red)':'var(--muted)')}] }),
      k.map(function(x){ return mKart(esc(x.mijoz||'—'),spul(x.tolangan),
        dfmt(x.sana)+' · '+esc(x.tovar)+' · '+fmt(x.soni)+' дона · '+esc(x.menejer)+(x.qarz>0?' · <span style="color:var(--red)">қарз '+spul(x.qarz)+'</span>':'')) }))+
    (q.length>k.length?'<div class="sub" style="margin-top:10px">Охирги '+k.length+' таси (жами '+fmt(q.length)+')</div>':'');
}

/* ══════════════════════════════════════════════════════
   2. ИШЛАБ ЧИҚАРИШ
   ══════════════════════════════════════════════════════ */

function iSatr(){ return D.ish ? sanaFiltrla(D.ish).map(function(x){ x.kishi=x.soni; return x }) : [] }
function iGrup(l,ol){ return grup(l,ol,function(x){ return x.soni },function(g,x){ if(x.birlik==='кв') g.b+=x.soni; else g.a+=x.soni }) }
function iBirlik(g){ return (g.a?fmt(g.a)+' шт':'')+(g.a&&g.b?' · ':'')+(g.b?fmt(g.b)+' кв':'') }

function ishSahifa(){
  var x=holat('ish');
  var nomlar={umumiy:'Ишлаб чиқариш — умумий',menejer:'Ишлаб чиқариш — усталар',kesim:'Ишлаб чиқариш — маҳсулот',jurnal:'Ишлаб чиқариш — ёзувлар'};
  if(x) return sarlavha(nomlar[S.sahifa],'',sanaFiltr())+x;
  S.birlik='бирлик';
  var l=iSatr();

  if(S.sahifa==='umumiy'){
    var j={sht:0,kv:0}; l.forEach(function(r){ if(r.birlik==='кв') j.kv+=r.soni; else j.sht+=r.soni });
    var bg=iGrup(l,function(r){ return r.bolim }), bm={};
    bg.forEach(function(g){ bm[g.nom.toLowerCase()]=g });
    var tartib=(D.bosqich||[]).slice();
    bg.forEach(function(g){ if(!tartib.some(function(t){ return t.toLowerCase()===g.nom.toLowerCase() })) tartib.push(g.nom) });
    var RR=['#E0A048','#E8776D','#6FA8DC','#4ECB92','#A08FD0','#D77B96','#C08B5E'];
    var arr='<div class="nr-oq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>';
    var oqim='<div class="nr-oqim">'+tartib.map(function(t,i){
      var g=bm[t.toLowerCase()];
      var top=g?grup(g.satrlar,function(r){ return r.usta },function(r){ return r.soni })[0]:null;
      return (i?arr:'')+'<div class="nr-bq'+(g?'':' bosh')+'" style="--pc:'+RR[i%RR.length]+';animation-delay:'+(i*.06)+'s">'+
        '<div class="nr-bn"><i>'+(i+1)+'</i>'+esc(t)+'</div>'+
        '<div class="nr-bv num">'+fmt(g?g.qiy:0)+'<small>бирлик</small></div>'+
        '<div class="nr-bs"><span>'+(g?iBirlik(g):'ёзув йўқ')+'</span>'+
          (top?'<span>Етакчи: <b>'+esc(top.nom)+'</b></span>':'')+'</div></div>';
    }).join('')+'</div>';
    return sarlavha(nomlar.umumiy,'Жараёнлар бўйича ишлаб чиқарилган маҳсулот',sanaFiltr())+
      '<div class="mets">'+
        metK('o','Жами',fmt(j.sht+j.kv),'бирлик (шт ва кв бирга)')+
        metK('','Дона',fmt(j.sht),'шт')+
        metK('k','Квадрат',fmt(j.kv),'кв')+
        metK('','Ёзувлар',fmt(l.length),grup(l,function(r){ return r.usta }).length+' та уста')+
      '</div>'+
      '<div class="sec"><h2>Жараёнлар</h2><p>Маҳсулот шу тартибда ўтади — ҳар бир босқичда қанча иш бажарилди</p></div>'+oqim+
      '<div class="two">'+
        '<div>'+bolim('Маҳсулот тури','Қайси тоифа кўп ишланди',
          ustunlar(iGrup(l,function(r){ return r.tur }).map(function(g){ return {nom:g.nom,qiy:g.qiy,ong:iBirlik(g)} })))+'</div>'+
        '<div>'+bolim('Жараёнлар улуши','Ҳар бир босқичнинг ҳиссаси',
          mDoira(bg.map(function(g){ return {nom:g.nom,summa:g.qiy,soni:g.soni} }),null,function(v){ return fmt(v) }))+'</div>'+
      '</div>'+
      bolim('Ишлаб чиқариш динамикаси','Ҳар бир санада неча бирлик ишланди',davrQatori(l)+dinamika(l));
  }

  if(S.sahifa==='menejer'){
    var u=iGrup(l,function(r){ return r.usta }), mx=u.length?u[0].qiy:1;
    return sarlavha(nomlar.menejer,'Ким қанча иш бажарди',sanaFiltr())+
      '<div class="grid">'+(u.length?u.map(function(g,i){
        var b=grup(g.satrlar,function(r){ return r.bolim }).map(function(z){ return z.nom }).join(', ');
        return '<div class="card"><span class="rank">#'+(i+1)+'</span><div class="cn">'+esc(g.nom)+'</div>'+
          '<div class="cm">'+esc(b)+'</div>'+
          '<div class="cq"><b class="num">'+fmt(g.qiy)+'</b><span>'+iBirlik(g)+'</span></div>'+
          '<div class="cbar"><i style="width:'+Math.max(3,g.qiy/mx*100)+'%;background:'+rang(i)+'"></i></div></div>';
      }).join(''):'<div class="empty">Маълумот йўқ</div>')+'</div>';
  }

  if(S.sahifa==='kesim'){
    return sarlavha(nomlar.kesim,'Қайси модел қанча ишланди',sanaFiltr())+
      bolim('Моделлар','Тип товар бўйича',
        ustunlar(iGrup(l,function(r){ return r.tovar }).slice(0,25).map(function(g){ return {nom:g.nom,ost:g.satrlar[0].tur,qiy:g.qiy,ong:iBirlik(g)} })));
  }

  var q=qFiltr(l,function(r){ return [r.bolim,r.tur,r.tovar,r.usta].join(' ') })
    .sort(function(a,b){ return (sanaOqi(b.sana)||0)-(sanaOqi(a.sana)||0) });
  var k=q.slice(0,300);
  return sarlavha(nomlar.jurnal,'«жами база» варағидаги ёзувлар',qidir('Уста, модел, жараён…')+sanaFiltr())+
    jadval([{n:'Сана'},{n:'Жараён'},{n:'Тур'},{n:'Модел'},{n:'Уста'},{n:'Сони',r:1}],
      k.map(function(r){ return [dfmt(r.sana),r.bolim,r.tur,r.tovar,r.usta,{h:fmt(r.soni)+' '+esc(r.birlik)}] }),
      k.map(function(r){ return mKart(esc(r.tovar||'—'),fmt(r.soni)+' '+esc(r.birlik),
        dfmt(r.sana)+' · <span class="nr-chip">'+esc(r.bolim)+'</span>'+esc(r.usta)) }))+
    (q.length>k.length?'<div class="sub" style="margin-top:10px">Охирги '+k.length+' таси (жами '+fmt(q.length)+')</div>':'');
}

/* ══════════════════════════════════════════════════════
   3. МАРКЕТИНГ
   ══════════════════════════════════════════════════════ */

function kSatr(){ return D.mk ? sanaFiltrla(D.mk) : [] }
function kGrup(l,ol){
  return grup(l,ol,null,function(g,x){ g.a+=x.sotuv }).map(function(g){ g.konv=g.soni?g.a/g.soni*100:0; return g });
}
function kf(v){ return (v>=10?Math.round(v):v.toFixed(1))+'%' }

function mkSahifa(){
  var x=holat('mk');
  var nomlar={umumiy:'Маркетинг — умумий',menejer:'Маркетинг — масъуллар',kesim:'Маркетинг — стадиялар'};
  if(x) return sarlavha(nomlar[S.sahifa]||'Маркетинг','',sanaFiltr())+x;
  S.birlik='лид';
  var l=kSatr(), sot=l.filter(function(r){ return r.sotuv }).length;

  if(S.sahifa==='menejer'){
    var m=kGrup(l,function(r){ return r.masul });
    return sarlavha(nomlar.menejer,'Ким қанча лид олди ва нечтасини сотувга айлантирди',sanaFiltr())+
      bolim('Масъуллар','Лид сони · ўнгда сотув ва конверсия',
        ustunlar(m.map(function(g){ return {nom:g.nom,qiy:g.qiy,ong:g.a+' сотув · '+kf(g.konv)} })));
  }
  if(S.sahifa==='kesim'){
    var st=kGrup(l,function(r){ return r.stadiya });
    return sarlavha(nomlar.kesim,'Лидлар ҳозир қайси босқичда',sanaFiltr())+
      bolim('Стадиялар','Bitrix стадияси бўйича',
        ustunlar(st.map(function(g){ return {nom:g.nom,qiy:g.qiy,ong:g.a?g.a+' сотув':''} })));
  }

  var kn=kGrup(l,function(r){ return r.kanal });
  var sl=l.filter(function(r){ return r.sotuv });
  return sarlavha(nomlar.umumiy,'Лидлар, сотувлар ва каналлар',sanaFiltr())+
    '<div class="mets">'+
      metK('o','Лидлар',fmt(l.length),'танланган даврда')+
      metK('k','Сотув',fmt(sot),'«sotuv bolbdi» = 1')+
      metK('','Конверсия',l.length?kf(sot/l.length*100):'—','лиддан сотувга')+
      metK('','Каналлар',fmt(kn.length),kn[0]?'энг кўп: '+esc(kn[0].nom):'')+
    '</div>'+
    '<div class="sec"><h2>Каналлар</h2><p>Лид қаердан келди ва қанчаси сотувга айланди</p></div>'+
    '<div class="nr-kan">'+kn.map(function(g,i){
      return '<div class="nr-kk" style="animation:kir .45s both;animation-delay:'+(i*.05)+'s"><h4>'+esc(g.nom)+'</h4>'+
        '<div class="v num">'+fmt(g.soni)+'<small>лид</small></div>'+
        '<div class="kn"><span>Сотув <b>'+fmt(g.a)+'</b></span><span>Конверсия <b>'+kf(g.konv)+'</b></span></div></div>';
    }).join('')+'</div>'+
    bolim('Лидлар динамикаси','Ҳар бир санада нечта лид тушди',davrQatori(l)+dinamika(l))+
    (sl.length?bolim('Сотувлар динамикаси','Ҳар бир санада нечта сотув бўлди',dinamika(sl)):'');
}

/* ══════════════════════════════════════════════════════
   4. МОЛИЯ
   «Мои долги» / «Долги мне» — қарз ҳисоблари.
   Улар кирим/чиқим таҳлилига кирмайди, кассаларда алоҳида кўринади.
   ══════════════════════════════════════════════════════ */

function qarzKassa(k){ return /долг|қарз|карз|qarz/i.test(String(k||'')) }
function fSatr(hammasi){
  if(!D.moliya) return [];
  var l=sanaFiltrla(D.moliya);
  return hammasi ? l : l.filter(function(x){ return !qarzKassa(x.kassa) });
}
function fJam(l){ var o={k:0,c:0}; l.forEach(function(x){ if(x.tip==='kirim') o.k+=x.summa; else o.c+=x.summa }); o.f=o.k-o.c; return o }
function fGrup(l,ol){ return grup(l,ol,function(x){ return x.summa }).map(function(g){ g.summa=g.qiy; return g }) }

function kassaBlok(barcha){
  var m={},t=[];
  barcha.forEach(function(x){
    var k=x.kassa||'Кўрсатилмаган';
    if(!m[k]){ m[k]={nom:k,k:0,c:0,soni:0}; t.push(k) }
    if(x.tip==='kirim') m[k].k+=x.summa; else m[k].c+=x.summa;
    m[k].soni++;
  });
  var KR=['#E0A048','#4ECB92','#6FA8DC','#A08FD0','#D77B96','#C08B5E'];
  function k(g,i){
    var q=g.k-g.c;
    return '<div class="pv-ka" style="--pc:'+KR[i%KR.length]+';animation-delay:'+(i*.06)+'s">'+
      '<div class="pv-kah"><i></i>'+esc(g.nom)+'</div>'+
      '<div class="pv-kv'+(q<0?' minus':'')+'"><span>Қолдиқ</span><b class="num">'+mpul(q)+'</b></div>'+
      '<div class="nr-bs" style="margin-top:10px"><span>кирим <b>'+mqisqa(g.k)+'</b> · чиқим <b>'+mqisqa(g.c)+'</b></span>'+
      '<span>'+fmt(g.soni)+' та ёзув</span></div></div>';
  }
  var asos=t.filter(function(n){ return !qarzKassa(n) }).map(function(n){ return m[n] });
  var qz=t.filter(function(n){ return qarzKassa(n) }).map(function(n){ return m[n] });
  var jami=0; asos.forEach(function(g){ jami+=g.k-g.c });
  var h='<div class="pv-kas">'+asos.map(k).join('')+'</div>'+
    '<div class="pv-kasj"><div class="pv-kick">Ҳамма кассада жами</div><div class="pv-kasjv">'+
      '<div class="pv-kv'+(jami<0?' minus':'')+'" style="margin:0"><b class="num" style="font-size:26px">'+mpul(jami)+'</b></div></div></div>';
  if(qz.length) h+='<div class="pv-vt" style="margin:18px 0 10px 2px">Қарз ҳисоблари</div><div class="pv-kas">'+qz.map(function(g,i){ return k(g,i+asos.length) }).join('')+'</div>';
  return h;
}

function moliyaSahifa(){
  var x=holat('moliya');
  var nomlar={umumiy:'Молия — умумий',menejer:'Молия — кирим',kesim:'Молия — чиқим',jurnal:'Молия — ёзувлар'};
  if(x) return sarlavha(nomlar[S.sahifa],'',sanaFiltr())+x;
  var l=fSatr(false), j=fJam(l);

  if(S.sahifa==='umumiy'){
    return sarlavha(nomlar.umumiy,'«Лист6» варағидан · қарз ҳисоблари алоҳида',sanaFiltr())+
      '<div class="mets">'+
        metK('k','Кирим',mqisqa(j.k),mpul(j.k))+
        metK('c','Чиқим',mqisqa(j.c),mpul(j.c))+
        metK(j.f<0?'c':'o','Фарқ',mqisqa(j.f),'кирим − чиқим')+
        metK('','Ёзувлар',fmt(l.length),'танланган даврда')+
      '</div>'+
      '<div class="sec"><h2>Кассалар</h2><p>Бутун тарих бўйича қолдиқ (сана фильтрига боғлиқ эмас)</p></div>'+kassaBlok(D.moliya)+
      bolim('Кирим ва чиқим динамикаси','Яшил — кирим, қизил — чиқим',davrQatori(l)+mDinamika(l));
  }
  if(S.sahifa==='menejer' || S.sahifa==='kesim'){
    var tip=S.sahifa==='menejer'?'kirim':'chiqim', lt=l.filter(function(x){ return x.tip===tip });
    var as=fGrup(lt,function(x){ return x.asosiy }), st=fGrup(lt,function(x){ return x.stadiya });
    return sarlavha(nomlar[S.sahifa],(tip==='kirim'?'Пул қаердан келди':'Пул қаерга кетди')+' · жами '+mpul(tip==='kirim'?j.k:j.c),sanaFiltr())+
      '<div class="two">'+
        '<div>'+bolim('Асосий стадия','Улуши',mDoira(as,tip==='kirim'?'var(--green)':'var(--red)',mqisqa))+'</div>'+
        '<div>'+bolim('Стадия','Батафсил',ustunlar(st.map(function(g){ return {nom:g.nom,ost:g.satrlar[0].asosiy,qiy:g.summa,ong:g.soni+' та'} })))+'</div>'+
      '</div>';
  }
  var q=qFiltr(fSatr(true),function(x){ return [x.kassa,x.asosiy,x.stadiya,x.izoh].join(' ') })
    .sort(function(a,b){ return (sanaOqi(b.sana)||0)-(sanaOqi(a.sana)||0) });
  var k=q.slice(0,300);
  return sarlavha(nomlar.jurnal,'«Лист6» — ҳамма ёзувлар, қарзлар ҳам',qidir('Касса, стадия, изоҳ…')+sanaFiltr())+
    jadval([{n:'Сана'},{n:'Касса'},{n:'Асосий стадия'},{n:'Стадия'},{n:'Изоҳ'},{n:'Сумма',r:1}],
      k.map(function(x){ var kr=x.tip==='kirim';
        return [dfmt(x.sana),x.kassa,x.asosiy,x.stadiya,x.izoh,{h:(kr?'+':'−')+mpul(x.summa),s:'font-weight:600;color:'+(kr?'var(--green)':'var(--red)')}] }),
      k.map(function(x){ var kr=x.tip==='kirim';
        return mKart(esc(x.stadiya||x.asosiy||x.izoh||'—'),'<span style="color:'+(kr?'var(--green)':'var(--red)')+'">'+(kr?'+':'−')+mpul(x.summa)+'</span>',
          dfmt(x.sana)+' · '+esc(x.kassa)+(x.izoh?' · '+esc(x.izoh):'')) }))+
    (q.length>k.length?'<div class="sub" style="margin-top:10px">Охирги '+k.length+' таси (жами '+fmt(q.length)+')</div>':'');
}

/* ══════════════════════════════════════════════════════
   5. HR — ОЙЛИКЛАР
   ══════════════════════════════════════════════════════ */

function hSatr(){ return D.hr ? sanaFiltrla(D.hr) : [] }
function hGrup(l,ol){ return grup(l,ol,function(x){ return x.jami },function(g,x){ g.a+=x.oklad; g.b+=x.kpi }) }
function oyRaqam(s){ var m=String(s||'').match(/^\s*(\d+)/); return m?+m[1]:99 }

function hrSahifa(){
  var x=holat('hr');
  var nomlar={umumiy:'HR — умумий',menejer:'HR — ходимлар',kesim:'HR — бўлимлар',jurnal:'HR — ёзувлар'};
  if(x) return sarlavha(nomlar[S.sahifa],'',sanaFiltr())+x;
  var l=hSatr(), j={jami:0,ok:0,kpi:0};
  l.forEach(function(r){ j.jami+=r.jami; j.ok+=r.oklad; j.kpi+=r.kpi });

  if(S.sahifa==='umumiy'){
    var oy=hGrup(l,function(r){ return r.oy }).sort(function(a,b){ return oyRaqam(a.nom)-oyRaqam(b.nom) });
    return sarlavha(nomlar.umumiy,'Ойлик фонди: оклад ва KPI',sanaFiltr())+
      '<div class="mets">'+
        metK('o','Жами фонд',mqisqa(j.jami),hpul(j.jami))+
        metK('','Оклад',mqisqa(j.ok),foiz(j.ok,j.jami)+'% улуши')+
        metK('k','KPI',mqisqa(j.kpi),foiz(j.kpi,j.jami)+'% улуши')+
        metK('','Ходимлар',fmt(hGrup(l,function(r){ return r.xodim }).length),fmt(oy.length)+' ой')+
      '</div>'+
      '<div class="two">'+
        '<div>'+bolim('Оклад ва KPI','Фонд таркиби',
          mDoira([{nom:'Оклад',summa:j.ok,soni:0},{nom:'KPI',summa:j.kpi,soni:0}].filter(function(z){ return z.summa }),null,mqisqa))+'</div>'+
        '<div>'+bolim('Ойлар бўйича','Ҳар ойда тўланган ойлик',
          ustunlar(oy.map(function(g){ return {nom:g.nom,qiy:g.qiy,ong:'KPI '+mqisqa(g.b)} })))+'</div>'+
      '</div>';
  }
  if(S.sahifa==='menejer'){
    var xd=hGrup(l,function(r){ return r.xodim });
    return sarlavha(nomlar.menejer,'Ким қанча олди — оклад ва KPI',qidir('Ходим…')+sanaFiltr())+
      bolim('Ходимлар','Жами олган ойлик',
        ustunlar(qFiltr(xd,function(g){ return g.nom }).map(function(g){
          return {nom:g.nom,ost:g.satrlar[0].bolim,qiy:g.qiy,ong:'оклад '+mqisqa(g.a)+' · KPI '+mqisqa(g.b)} })));
  }
  if(S.sahifa==='kesim'){
    var bl=hGrup(l,function(r){ return r.bolim });
    return sarlavha(nomlar.kesim,'Қайси бўлимга қанча ойлик',sanaFiltr())+
      '<div class="two">'+
        '<div>'+bolim('Бўлимлар улуши','Фонддаги ҳиссаси',mDoira(bl.map(function(g){ return {nom:g.nom,summa:g.qiy,soni:g.soni} }),null,mqisqa))+'</div>'+
        '<div>'+bolim('Бўлимлар','Жами ойлик',ustunlar(bl.map(function(g){ return {nom:g.nom,qiy:g.qiy,ong:grup(g.satrlar,function(r){ return r.xodim }).length+' ходим'} })))+'</div>'+
      '</div>';
  }
  var q=qFiltr(l,function(r){ return [r.xodim,r.bolim,r.oy].join(' ') })
    .sort(function(a,b){ return (sanaOqi(b.sana)||0)-(sanaOqi(a.sana)||0) });
  return sarlavha(nomlar.jurnal,'«хр» варағидаги ёзувлар',qidir('Ходим, бўлим, ой…')+sanaFiltr())+
    jadval([{n:'Сана'},{n:'Ходим'},{n:'Бўлим'},{n:'Ой'},{n:'Оклад',r:1},{n:'KPI',r:1},{n:'Итог',r:1}],
      q.map(function(r){ return [dfmt(r.sana),r.xodim,r.bolim,r.oy,{h:hpul(r.oklad)},{h:hpul(r.kpi)},{h:hpul(r.jami),s:'font-weight:600'}] }),
      q.map(function(r){ return mKart(esc(r.xodim),hpul(r.jami),esc(r.bolim)+' · '+esc(r.oy)+' · оклад '+hpul(r.oklad)+' · KPI '+hpul(r.kpi)) }));
}

/* ══════════════════════════════════════════════════════
   МЕНЮ ва ЧИЗИШ
   ══════════════════════════════════════════════════════ */

function menyu(){
  function n(k){ return D[k]?sanaFiltrla(D[k]).length:null }
  switch(S.prod){
    case 'panel': return [{p:'umumiy',nom:'Умумий',ik:'chart'}];
    case 'sotuv': return [{p:'umumiy',nom:'Умумий',ik:'chart'},{p:'menejer',nom:'Менежерлар',ik:'odam'},
                          {p:'kesim',nom:'Маҳсулот',ik:'joy'},{p:'jurnal',nom:'Сотувлар',ik:'jadval',son:n('sotuv')}];
    case 'ish':   return [{p:'umumiy',nom:'Умумий',ik:'chart'},{p:'menejer',nom:'Усталар',ik:'odam'},
                          {p:'kesim',nom:'Моделлар',ik:'joy'},{p:'jurnal',nom:'Ёзувлар',ik:'jadval',son:n('ish')}];
    case 'mk':    return [{p:'umumiy',nom:'Умумий',ik:'chart'},{p:'menejer',nom:'Масъуллар',ik:'odam'},
                          {p:'kesim',nom:'Стадиялар',ik:'joy',son:n('mk')}];
    case 'moliya':return [{p:'umumiy',nom:'Умумий',ik:'chart'},{p:'menejer',nom:'Кирим',ik:'kirim'},
                          {p:'kesim',nom:'Чиқим',ik:'chiqim'},{p:'jurnal',nom:'Ёзувлар',ik:'jadval',son:n('moliya')}];
    case 'hr':    return [{p:'umumiy',nom:'Умумий',ik:'chart'},{p:'menejer',nom:'Ходимлар',ik:'odam'},
                          {p:'kesim',nom:'Бўлимлар',ik:'joy'},{p:'jurnal',nom:'Ёзувлар',ik:'jadval',son:n('hr')}];
  }
  return [];
}

function chiz(){
  var m=menyu();
  if(!m.some(function(x){ return x.p===S.sahifa })) S.sahifa='umumiy';
  S.birlik='та';
  main.innerHTML =
    S.prod==='panel'  ? panelSahifa()  :
    S.prod==='sotuv'  ? sotuvSahifa()  :
    S.prod==='ish'    ? ishSahifa()    :
    S.prod==='mk'     ? mkSahifa()     :
    S.prod==='moliya' ? moliyaSahifa() : hrSahifa();

  document.body.classList.toggle('dokyoq', m.length<2);
  ['#side','#bnav'].forEach(function(joy){
    var n=document.querySelectorAll(joy+' .ni[data-p]');
    for(var i=0;i<n.length;i++){
      var b=m[i];
      if(!b){ n[i].style.display='none'; continue }
      n[i].style.display='';
      n[i].dataset.p=b.p;
      n[i].querySelector('.ik').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+IKONKA[b.ik]+'</svg>';
      n[i].querySelector('.nt').textContent=b.nom;
      var sn=n[i].querySelector('.nson'), bor=(b.son||b.son===0);
      sn.textContent=bor?fmt(b.son):''; sn.style.display=bor?'':'none';
      n[i].classList.toggle('on',b.p===S.sahifa);
    }
  });
  var p=document.querySelectorAll('#pswitch button');
  for(var j=0;j<p.length;j++) p[j].classList.toggle('on',p[j].dataset.prod===S.prod);
  document.getElementById('tbProd').textContent=PROD_NOM[S.prod]||'';
}

/* ══════════════════════════════════════════════════════
   ҲОДИСАЛАР
   ══════════════════════════════════════════════════════ */

function tepaga(){ main.scrollTop=0 }
function sahifaOch(nom){ S.sahifa=nom; S.qidiruv=''; chiz(); tepaga() }
function produktOch(p){
  if(S.prod===p) return;
  S.prod=p; S.sahifa='umumiy'; S.qidiruv='';
  kerakliYukla(); chiz(); tepaga();
}

document.querySelectorAll('.ni[data-p]').forEach(function(b){ b.onclick=function(){ sahifaOch(this.dataset.p) } });
document.querySelectorAll('#pswitch button').forEach(function(b){ b.onclick=function(){ produktOch(this.dataset.prod) } });

main.addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-o]'))){
    S.oraliq=t.dataset.o;
    if(S.oraliq!=='oraliq'){ S.dan=null; S.gacha=null }
    chiz(); return;
  }
  if(e.target.closest('#qollaBtn')){
    var a=document.getElementById('dan').value, b=document.getElementById('gacha').value;
    if(!a&&!b){ xabar('Санани танланг',true); return }
    S.tmpDan=a; S.tmpGacha=b; S.dan=a||null; S.gacha=b||null;
    chiz(); xabar('Сана қўлланди'); return;
  }
  if((t=e.target.closest('[data-davr]'))){ S.davr=t.dataset.davr; chiz(); return }
});
main.addEventListener('input',function(e){
  if(e.target.id==='qid'){
    S.qidiruv=e.target.value;
    var joy=e.target.selectionStart;
    chiz();
    var n=document.getElementById('qid'); if(n){ n.focus(); n.setSelectionRange(joy,joy) }
  }
  if(e.target.id==='dan')   S.tmpDan=e.target.value;
  if(e.target.id==='gacha') S.tmpGacha=e.target.value;
});

function hammasiYangila(){
  xabar('Янгиланмоқда…');
  S.yangi=true; kerakliYukla(true);
  setTimeout(function(){ S.yangi=false },4000);
}
document.getElementById('yangilaBtn').onclick=hammasiYangila;
document.getElementById('yangilaBtn2').onclick=hammasiYangila;
function temaAlmash(){ temaQoy(!qoraMi(),true); chiz() }
document.getElementById('temaBtn').onclick=temaAlmash;
document.getElementById('temaBtn2').onclick=temaAlmash;

/* ── Чап меню ── */
function telefonmi(){ return window.matchMedia('(max-width:820px)').matches }
function menyuHolat(ochiq){
  document.body.classList.toggle('yopiq',!ochiq);
  try{ if(!telefonmi()) localStorage.setItem(MENYU,ochiq?'1':'0') }catch(e){}
}
document.getElementById('burger').onclick=function(){ menyuHolat(document.body.classList.contains('yopiq')) };
